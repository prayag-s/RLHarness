[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-ide"
version = "0.1.0"
description = "RL-Native Agent IDE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pyyaml",
    "numpy",
    "pandas",
    "gymnasium",
    "stable-baselines3",
    "torch",
    "onnx",
    "onnxruntime",
    "scikit-learn",
    "httpx",
    "pypdf",
    "python-docx",
    "openpyxl",
    "sqlalchemy",
    "pymysql",
    "psycopg2-binary",
    "python-multipart",
    "reportlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not live_llm"'
markers = [
    "live_llm: drives the real LLM-backed studio pipeline; excluded from the default run, opt in with RL_IDE_LIVE_LLM=1",
    "slow: trains, exports or spawns sandbox workers; runs in the full suite and in CI's nightly job",
]
